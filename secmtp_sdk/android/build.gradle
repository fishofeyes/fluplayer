plugins {
    id 'com.android.library'
}

apply from: 'networks.gradle'

android {
    if (project.android.hasProperty("namespace")) {
        namespace "com.secmtp.flutter"
    }
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // compileOnly Maven SDK (networks.gradle); host app provides runtime (see example/android/app/build_nonchina.gradle).
    compileOnly 'com.android.support:appcompat-v7:28.0.0'
    compileOnly fileTree(dir: 'libs_compile', include: '*.jar')
    compileOnly 'androidx.annotation:annotation:1.1.0'
}

